<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — BrightStack Co.</title>
<link rel="canonical" href="https://hassansaeed14.github.io/brightstack-portfolio/signin.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Sign in — BrightStack Co.">
<meta property="og:description" content="An interactive portfolio project by Hassan Saeed at BrightStack Co.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Three.js Library for 3D Background Constellation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #030508;
    --text: #f8fafc;
    --muted: #8e9aad;
    --cyan: #00e5ff;
    --cyan-soft: rgba(0, 229, 255, 0.15);
    --peach: #ffd8bd;
    --purple: #8b5cf6;
    --glass: rgba(10, 15, 24, 0.75);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(0,229,255,0.35);
    --max-width: 440px;
    --radius-lg: 28px;
    --radius-md: 18px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --red: #ff5555;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 80% 15%, rgba(0,229,255,0.06), transparent 35%),
                radial-gradient(circle at 15% 85%, rgba(139,92,246,0.05), transparent 35%),
                var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .background {
    position: fixed; inset: 0; pointer-events: none; z-index: -10; overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.15;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }
  #bg3d { position: absolute; inset: 0; width: 100%; height: 100%; }

  header {
    position: absolute; top: 24px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: center;
    max-width: 1000px; margin: 0 auto; width: calc(100% - 64px);
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand-mark {
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px;
    background: linear-gradient(135deg, var(--cyan), #4ddfff); color: #001014; font-size: 14px; font-weight: 800;
    box-shadow: 0 0 25px rgba(0,229,255,0.2); animation: markspin 10s linear infinite;
  }
  @keyframes markspin { 0%,80%{transform:perspective(200px) rotateY(0)} 100%{transform:perspective(200px) rotateY(360deg)} }
  .logo span { color: var(--cyan); text-shadow: 0 0 20px rgba(0,229,255,0.3); }
  .back-link { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--muted); transition: color 0.3s; }
  .back-link:hover { color: var(--cyan); }

  .card {
    width: 100%;
    max-width: var(--max-width);
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 35px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    margin-top: 40px;
    position: relative;
    z-index: 2;
  }

  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
  .card p.sub { font-size: 13.5px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }

  .oauth-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .auth-provider-btn {
    width: 100%;
    padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.03); font-weight: 600;
    font-size: 13.5px; cursor: pointer; text-align: center; color: var(--text);
    transition: all 0.3s var(--ease);
  }
  .auth-provider-btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-soft); transform: translateY(-2px); box-shadow: 0 0 20px rgba(0,229,255,0.15); }

  .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; color: var(--muted); font-size: 11.5px; font-family: 'JetBrains Mono', monospace; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .field input {
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
    font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; background: rgba(255,255,255,0.03); color: var(--text);
    outline: none; transition: border-color 0.3s, box-shadow 0.3s;
  }
  .field input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,229,255,0.15); }

  .primary-btn {
    width: 100%; background: var(--cyan); color: #030508; border: none; padding: 13px; border-radius: 12px;
    font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px;
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px;
    transition: all 0.3s var(--ease);
  }
  .primary-btn:hover { background: var(--peach); transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,216,189,0.3); }

  .toggle-row { text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); }
  .toggle-row button { background: none; border: none; color: var(--cyan); font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit; transition: color 0.3s; }
  .toggle-row button:hover { color: var(--peach); text-decoration: underline; }

  #authStatus { font-size: 12px; color: var(--muted); margin-top: 14px; text-align: center; min-height: 16px; font-family: 'JetBrains Mono', monospace; }
  #authStatus.error { color: var(--red); }

  footer { padding: 24px 32px 10px; text-align: center; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; max-width: 500px; line-height: 1.5; position: relative; z-index: 2; }

  @media (max-width: 560px) {
    header { left: 18px; right: 18px; width: calc(100% - 36px); top: 16px; }
    .card { padding: 26px 20px; border-radius: var(--radius-md); }
    h1 { font-size: 21px; }
  }
</style>
<meta name="description" content="Sign in to your BrightStack Co. account to track project status, communicate with the team, and access deliverables.">
</head>
<body>

<div class="background">
  <div class="grid"></div>
  <canvas id="bg3d" aria-hidden="true"></canvas>
</div>

<header>
  <div class="logo">
    <div class="brand-mark">B</div>
    Bright<span>Stack</span> Co.
  </div>
  <a href="index.html" class="back-link">← Back to portfolio</a>
</header>

<div class="card">
  <h1 id="formTitle">Sign in to BrightStack</h1>
  <p class="sub">Access your client area — project status, messages, and deliverables.</p>

  <div class="oauth-row">
    <button class="auth-provider-btn" onclick="signInOAuth('google')">Continue with Google</button>
  </div>

  <div class="divider">or with email</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="emailInput" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="passwordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') submitEmailAuth();">
  </div>
  <button class="primary-btn" id="emailSubmitBtn" onclick="submitEmailAuth()">Sign in</button>

  <div class="toggle-row" id="toggleRow">
    Don't have an account? <button onclick="toggleMode()">Create one</button>
  </div>

  <div id="authStatus"></div>
</div>

<footer>Your password is handled directly by Firebase Authentication — BrightStack never sees or stores it in plain text.</footer>

<script type="module">
  import { auth, db, googleProvider } from './firebase-config.js';
  import {
    signInWithPopup, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  let isSignUp = false;

  window.toggleMode = () => {
    isSignUp = !isSignUp;
    document.getElementById('formTitle').textContent = isSignUp ? 'Create your account' : 'Sign in to BrightStack';
    document.getElementById('emailSubmitBtn').textContent = isSignUp ? 'Create account' : 'Sign in';
    document.getElementById('toggleRow').innerHTML = isSignUp
      ? `Already have an account? <button onclick="toggleMode()">Sign in</button>`
      : `Don't have an account? <button onclick="toggleMode()">Create one</button>`;
    document.getElementById('authStatus').textContent = '';
  };

  async function ensureClientDoc(user){
    const ref = doc(db, 'clients', user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()){
      await setDoc(ref, {
        name: user.displayName || user.email || 'New client',
        email: user.email || '',
        projectStatus: 'No active project yet',
        messages: []
      });
    }
  }

  function redirectAfterAuth(){
    const pending = sessionStorage.getItem('pendingProject');
    if (pending){
      sessionStorage.removeItem('pendingProject');
      window.location.href = pending;
    } else {
      window.location.href = 'client-area.html';
    }
  }

  window.signInOAuth = async (name) => {
    const statusEl = document.getElementById('authStatus');
    statusEl.className = '';
    statusEl.textContent = 'Opening ' + name + ' sign-in…';
    try {
      const provider = googleProvider;
      const result = await signInWithPopup(auth, provider);
      await ensureClientDoc(result.user);
      redirectAfterAuth();
    } catch (err){
      statusEl.className = 'error';
      statusEl.textContent = 'Sign-in failed: ' + err.message;
    }
  };

  window.submitEmailAuth = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const statusEl = document.getElementById('authStatus');
    statusEl.className = '';
    if (!email || !password){
      statusEl.className = 'error';
      statusEl.textContent = 'Enter both an email and a password.';
      return;
    }
    if (password.length < 6){
      statusEl.className = 'error';
      statusEl.textContent = 'Password must be at least 6 characters.';
      return;
    }
    statusEl.textContent = isSignUp ? 'Creating your account…' : 'Signing in…';
    try {
      let result;
      if (isSignUp){
        result = await createUserWithEmailAndPassword(auth, email, password);
      } else {
        result = await signInWithEmailAndPassword(auth, email, password);
      }
      await ensureClientDoc(result.user);
      redirectAfterAuth();
    } catch (err){
      statusEl.className = 'error';
      if (err.code === 'auth/email-already-in-use'){
        statusEl.textContent = 'That email already has an account — try signing in instead.';
      } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password'){
        statusEl.textContent = 'Incorrect email or password.';
      } else if (err.code === 'auth/user-not-found'){
        statusEl.textContent = 'No account found with that email — try creating one instead.';
      } else {
        statusEl.textContent = err.message;
      }
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) redirectAfterAuth();
  });

  /* Three.js Background Constellation matching index.html */
  (function(){
    if(typeof THREE === 'undefined') return;
    const canvas = document.getElementById('bg3d'); let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true }); } catch(e){ return; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(60, 1, .1, 200); cam.position.z = 14;
    const N = innerWidth < 768 ? 250 : 600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), pal = [new THREE.Color(0x00e5ff), new THREE.Color(0x8b5cf6), new THREE.Color(0xffd8bd)];
    for(let i = 0; i < N; i++){
      pos.set([(Math.random() - .5) * 44, 8 - Math.random() * 58, -Math.random() * 25 + 4], i * 3);
      const c = pal[Math.random() < .6 ? 0 : Math.random() < .6 ? 1 : 2]; col.set([c.r, c.g, c.b], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const pts = new THREE.Points(g, new THREE.PointsMaterial({ size: .1, vertexColors: true, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(pts);
    function size(){ renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
    addEventListener('resize', size); size();
    let nx = 0, ny = 0;
    addEventListener('mousemove', e => { nx = e.clientX / innerWidth - .5; ny = e.clientY / innerHeight - .5; }, { passive: true });
    (function loop(t){
      requestAnimationFrame(loop); if(document.hidden) return;
      cam.position.x += (nx * 3 - cam.position.x) * .04;
      cam.rotation.y += ((-nx * .08) - cam.rotation.y) * .04;
      cam.rotation.x += ((ny * .05) - cam.rotation.x) * .04;
      pts.rotation.y = t * .000015; pts.position.y = Math.sin(t * .0003) * .3;
      renderer.render(scene, cam);
    })(0);
  })();
</script>

</body>
</html>
