<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aether 3D Sound & Frequency Lab</title>
<link rel="canonical" href="https://hassansaeed14.github.io/brightstack-portfolio/aether-sound-lab.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Aether — 3D Sound & Frequency Lab">
<meta property="og:description" content="An interactive 3D audio experiment by Hassan Saeed at BrightStack Co.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --bg: #06080e;
    --surface: rgba(16, 20, 30, 0.7);
    --gold: #d8b46a;
    --gold-light: #efe0ba;
    --cyan: #4cc3ff;
    --text: #f4f2ea;
    --muted: #9b9eb0;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(216,180,106,0.35);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }

  #canvas3d { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  .brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--gold-light), var(--gold)); display: grid; place-items: center; color: #14151b; font-weight: 800; box-shadow: 0 0 20px rgba(216,180,106,0.3); }
  
  .back-btn { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 8px 16px; border-radius: 99px; border: 1px solid var(--border); transition: all 0.2s; }
  .back-btn:hover { color: var(--text); border-color: var(--gold); background: rgba(216,180,106,0.05); }

  .hero-layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; min-height: calc(100vh - 160px); }
  
  .content h1 { font-size: clamp(38px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 20px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
  .content h1 span { color: var(--gold); }
  .content p { font-size: 16px; color: var(--muted); line-height: 1.6; margin-bottom: 32px; max-width: 460px; }

  .lab-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px;
    backdrop-filter: blur(20px); box-shadow: 0 30px 60px rgba(0,0,0,0.5); transition: border-color 0.3s;
  }
  .lab-card:hover { border-color: var(--border-hover); }

  .control-group { margin-bottom: 24px; }
  .control-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace; }
  .control-label span:last-child { color: var(--gold); }

  input[type=range] {
    width: 100%; -webkit-appearance: none; background: rgba(255,255,255,0.08); height: 6px; border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); cursor: pointer;
    box-shadow: 0 0 15px rgba(216,180,106,0.5); transition: transform 0.2s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
  .btn {
    padding: 14px; border-radius: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; border: none;
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s var(--ease);
  }
  .btn-primary { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #14151b; box-shadow: 0 10px 25px rgba(216,180,106,0.25); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(216,180,106,0.4); }
  .btn-secondary { background: rgba(255,255,255,0.03); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: var(--muted); }

  @media(max-width: 900px) {
    .hero-layout { grid-template-columns: 1fr; padding-bottom: 40px; }
  }
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">Ae</div>
      Aether Lab
    </div>
    <a href="uiux-collection.html" class="back-btn">← Back to Collection</a>
  </header>

  <div class="hero-layout">
    <div class="content">
      <h1>Sculpt sound in <span>3D space</span>.</h1>
      <p>Aether turns abstract frequencies and oscillations into tactile, reactive 3D geometric waves. Adjust frequency, resonance, and turbulence in real-time.</p>
      <div style="display:flex; gap:12px;">
        <button class="btn btn-primary" onclick="triggerPulse()">Pulse Wave</button>
        <button class="btn btn-secondary" onclick="toggleGeometry()">Switch Core</button>
      </div>
    </div>

    <div class="lab-card">
      <div class="control-group">
        <div class="control-label"><span>Frequency</span><span id="freqVal">432 Hz</span></div>
        <input type="range" id="freqRange" min="100" max="880" value="432" oninput="updateFreq(this.value)">
      </div>
      <div class="control-group">
        <div class="control-label"><span>Resonance / Amplitude</span><span id="resVal">65%</span></div>
        <input type="range" id="resRange" min="10" max="100" value="65" oninput="updateRes(this.value)">
      </div>
      <div class="control-group">
        <div class="control-label"><span>Turbulence</span><span id="turbVal">3.2x</span></div>
        <input type="range" id="turbRange" min="1" max="10" step="0.1" value="3.2" oninput="updateTurb(this.value)">
      </div>

      <div class="actions-grid">
        <button class="btn btn-secondary" onclick="resetLab()">Reset Lab</button>
        <button class="btn btn-primary" id="toggleAudioBtn" onclick="toggleAudioEngine()">Start Audio</button>
      </div>
    </div>
  </div>
</div>

<script>
let audioCtx = null, osc = null, gainNode = null, isPlaying = false;
let freq = 432, resonance = 0.65, turbulence = 3.2;

function updateFreq(val){
  freq = val; document.getElementById('freqVal').textContent = val + ' Hz';
  if(osc) osc.frequency.setValueAtTime(val, audioCtx.currentTime);
}
function updateRes(val){ resonance = val / 100; document.getElementById('resVal').textContent = val + '%'; }
function updateTurb(val){ turbulence = parseFloat(val); document.getElementById('turbVal').textContent = val + 'x'; }

function toggleAudioEngine(){
  const btn = document.getElementById('toggleAudioBtn');
  if(!isPlaying){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.start();
    isPlaying = true; btn.textContent = 'Stop Audio'; btn.style.background = '#d8b46a'; btn.style.color = '#14151b';
  } else {
    if(osc) { osc.stop(); osc.disconnect(); }
    isPlaying = false; btn.textContent = 'Start Audio'; btn.style.background = ''; btn.style.color = '';
  }
}

function triggerPulse(){
  pulseStrength = 2.5;
}

let currentGeoType = 0;
function toggleGeometry(){
  currentGeoType = (currentGeoType + 1) % 3;
  rebuildGeometry();
}

function resetLab(){
  document.getElementById('freqRange').value = 432; updateFreq(432);
  document.getElementById('resRange').value = 65; updateRes(65);
  document.getElementById('turbRange').value = 3.2; updateTurb(3.2);
}

/* Three.js 3D Sound Wave Visualizer */
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 7;

let particleCount = 2000;
let geometry = new THREE.BufferGeometry();
let positions = new Float32Array(particleCount * 3);
let originalPositions = new Float32Array(particleCount * 3);

function rebuildGeometry(){
  positions = new Float32Array(particleCount * 3);
  originalPositions = new Float32Array(particleCount * 3);
  
  for(let i = 0; i < particleCount * 3; i += 3){
    let u = Math.random() * Math.PI * 2;
    let v = Math.acos(Math.random() * 2 - 1);
    let r = 2.2 + Math.random() * 0.4;
    
    if(currentGeoType === 1) { // Torus ring
      u = Math.random() * Math.PI * 2;
      v = Math.random() * Math.PI * 2;
      let R = 2.5, r2 = 0.8;
      positions[i] = (R + r2 * Math.cos(v)) * Math.cos(u);
      positions[i+1] = (R + r2 * Math.cos(v)) * Math.sin(u);
      positions[i+2] = r2 * Math.sin(v);
    } else if(currentGeoType === 2) { // Helix wave
      let h = (Math.random() - 0.5) * 6;
      let theta = Math.random() * Math.PI * 8;
      positions[i] = Math.cos(theta) * 2;
      positions[i+1] = h;
      positions[i+2] = Math.sin(theta) * 2;
    } else { // Sphere cluster
      positions[i] = r * Math.sin(v) * Math.cos(u);
      positions[i+1] = r * Math.sin(v) * Math.sin(u);
      positions[i+2] = r * Math.cos(v);
    }
    originalPositions[i] = positions[i];
    originalPositions[i+1] = positions[i+1];
    originalPositions[i+2] = positions[i+2];
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
}

rebuildGeometry();

const material = new THREE.PointsMaterial({
  size: 0.05,
  color: 0xd8b46a,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, material);
scene.add(particleSystem);

function onResize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / innerWidth - 0.5) * 2;
  mouseY = (e.clientY / innerHeight - 0.5) * 2;
});

let pulseStrength = 0;

function animate(time){
  requestAnimationFrame(animate);
  const t = time * 0.001;

  pulseStrength *= 0.92;
  
  const posAttr = geometry.attributes.position;
  const posArray = posAttr.array;

  for(let i = 0; i < particleCount * 3; i += 3){
    let ox = originalPositions[i];
    let oy = originalPositions[i+1];
    let oz = originalPositions[i+2];

    let wave = Math.sin(t * (freq / 100) + ox * turbulence) * (resonance * 0.3 + pulseStrength);
    
    posArray[i] = ox + wave * 0.2;
    posArray[i+1] = oy + wave * 0.2;
    posArray[i+2] = oz + wave * 0.2;
  }
  posAttr.needsUpdate = true;

  particleSystem.rotation.y = t * 0.1 + mouseX * 0.5;
  particleSystem.rotation.x = t * 0.05 + mouseY * 0.5;

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
