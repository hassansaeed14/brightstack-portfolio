<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — BrightStack Co.</title>
<link rel="canonical" href="https://hassansaeed14.github.io/brightstack-portfolio/signin.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Sign In — BrightStack Co.">
<meta property="og:description" content="Secure sign in to BrightStack client portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070b;
    --bg-soft: #080c13;
    --text: #f8fafc;
    --muted: #8e9aad;
    --cyan: #00e5ff;
    --cyan-soft: rgba(0, 229, 255, 0.15);
    --peach: #ffd8bd;
    --purple: #8b5cf6;
    --glass: rgba(10, 15, 24, 0.65);
    --border: rgba(255,255,255,0.085);
    --border-hover: rgba(0,229,255,0.38);
    --max-width: 440px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --red: #ff4d4d;
  }
  
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 75% 20%, rgba(0,229,255,0.07), transparent 30%),
      radial-gradient(circle at 20% 70%, rgba(139,92,246,0.06), transparent 30%),
      var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .background {
    position: fixed; inset: 0; pointer-events: none; z-index: -10; overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.23;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
  }
  .orb {
    position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(100px); opacity: 0.08;
  }
  .orb.one { top: -150px; right: -100px; background: var(--cyan); }
  .orb.two { bottom: -150px; left: -100px; background: var(--purple); }

  .auth-card {
    width: 100%;
    max-width: var(--max-width);
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 28px;
    color: var(--text);
  }
  .brand-mark {
    width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 10px; background: linear-gradient(135deg, var(--cyan), #4ddfff);
    color: #001014; font-size: 14px; font-weight: 800;
  }
  .brand span { color: var(--cyan); }

  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 13.5px; margin-bottom: 24px; line-height: 1.5; }

  .social-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s var(--ease);
    margin-bottom: 20px;
  }
  .social-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: var(--border-hover);
    transform: translateY(-2px);
  }
  .social-btn svg { width: 18px; height: 18px; }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; border-bottom: 1px solid var(--border);
  }
  .divider::before { margin-right: 12px; }
  .divider::after { margin-left: 12px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif; outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,229,255,0.15); }

  .submit-btn {
    width: 100%; background: var(--cyan); color: #001014; border: none;
    padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: transform 0.3s var(--ease), background 0.3s ease;
    margin-top: 6px; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .submit-btn:hover { background: var(--peach); transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,216,189,0.3); }

  .error-msg {
    background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3);
    color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 12.5px;
    margin-bottom: 16px; display: none; font-family: 'JetBrains Mono', monospace;
  }

  .back-home {
    display: block; text-align: center; margin-top: 24px; color: var(--muted);
    font-size: 12px; font-family: 'JetBrains Mono', monospace; transition: color 0.3s;
  }
  .back-home:hover { color: var(--cyan); }
</style>
</head>
<body>

<div class="background">
  <div class="grid"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>
</div>

<div class="auth-card">
  <a href="index.html" class="brand">
    <div class="brand-mark">B</div>
    Bright<span>Stack</span>
  </a>

  <h1>Client Sign In</h1>
  <p class="subtitle">Access your portal to monitor live milestones and manage project specifications.</p>

  <div class="error-msg" id="errorMsg"></div>

  <button class="social-btn" id="googleBtn">
    <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.8 7.3l3.7 2.9C6.4 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.5 10.2c-.2.7-.4 1.5-.4 2.3s.2 1.6.4 2.3L1.8 17.7C1.1 16.3 0.7 14.7 0.7 13s.4-3.3 1.1-4.7l3.7 2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.6-2.2-6.5-5.2L1.8 16C3.7 19.7 7.5 23 12 23z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or continue with email</div>

  <form id="emailForm">
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" class="input" placeholder="name@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" class="input" placeholder="••••••••" required>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
  </form>

  <a href="index.html" class="back-link back-home">← Back to portfolio</a>
</div>

<script type="module">
  import { auth } from './firebase-config.js';
  import {
    signInWithPopup, GoogleAuthProvider,
    signInWithEmailAndPassword, createUserWithEmailAndPassword
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const errorEl = document.getElementById('errorMsg');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  document.getElementById('googleBtn').addEventListener('click', async () => {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
      location.href = 'client-area.html';
    } catch (err) {
      showError(err.message);
    }
  });

  document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    
    try {
      await signInWithEmailAndPassword(auth, email, password);
      location.href = 'client-area.html';
    } catch (err) {
      if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          location.href = 'client-area.html';
          return;
        } catch (createErr) {
          showError(createErr.message);
        }
      } else {
        showError(err.message);
      }
    }
  });
</script>

</body>
</html>
